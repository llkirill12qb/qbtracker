<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding Complete</title>
    <style>
        :root {
            --bg: #f4f8fb;
            --card: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --primary: #08a9d6;
            --success-bg: #dcfce7;
            --success-text: #166534;
            --shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
            color: var(--text);
        }

        .card {
            width: min(620px, 100%);
            background: var(--card);
            border-radius: 22px;
            box-shadow: var(--shadow);
            padding: 34px;
            text-align: center;
        }

        .success {
            display: inline-flex;
            margin-bottom: 18px;
            padding: 9px 13px;
            border-radius: 999px;
            background: var(--success-bg);
            color: var(--success-text);
            font-weight: bold;
        }

        h1 {
            margin: 0;
            font-size: clamp(32px, 7vw, 48px);
            letter-spacing: -0.05em;
        }

        p {
            margin: 14px 0 0;
            color: var(--muted);
            line-height: 1.6;
        }

        .details {
            margin-top: 24px;
            padding: 18px;
            border-radius: 16px;
            background: #f8fafc;
            text-align: left;
            line-height: 1.8;
        }

        .code {
            color: var(--primary);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="success">Submitted</div>
        <h1>Onboarding Complete</h1>
        <p>
            Thank you, {{ employee.full_name }}. Your information was sent to {{ company.name }} for {{ location.name }}.
        </p>
        <div class="details">
            <div><strong>Status:</strong> Pending Photo</div>
            <div><strong>Temporary card ID:</strong> <span class="code">{{ employee.card_id }}</span></div>
            <div><strong>Next step:</strong> Site staff will find you in QB Tracker, take your photo, and print your badge.</div>
        </div>
    </main>
</body>
</html>
